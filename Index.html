<script>
const MY_APP_ID = 34SmVvQiMGI6jzq4Y7qdi;
const MY_LOGIN_ID = "";
const MY_DEFAULT_STAKE = 10;
const MY_DEFAULT_BOT_STAKE = 10;
const MY_TAKE_PROFIT = 100;
const MY_STOP_LOSS = 50;
let ws=null, token=null, account=null, currentProposal=null, data={}, activeSymbol="R_100", botRunning=false, botTimer=null, botProfit=0;
function connectWS(){
  if(ws) ws.close();
  ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id='+34SmVvQiMGI6jzq4Y7qdi);
  ws.onopen=()=>{
    document.getElementById('status').textContent='✅ Connected - App ID: '+34SmVvQiMGI6jzq4Y7qdi+' | Login ID: '+(MY_LOGIN_ID||'--');
    if(MY_LOGIN_ID) document.getElementById('loginid').textContent=MY_LOGIN_ID;
    if(token) ws.send(JSON.stringify({authorize:token}));
    subscribeTicks(activeSymbol); getHistory(activeSymbol);
  };
  ws.onmessage=(e)=>{
    const msg=JSON.parse(e.data);
    if(msg.error){ document.getElementById('status').textContent='Error: '+msg.error.message; return; }
    if(msg.authorize){ account=msg.authorize; document.getElementById('loginid').textContent=account.loginid; document.getElementById('balance').textContent=account.balance+' '+account.currency; }
    if(msg.balance){ document.getElementById('balance').textContent=msg.balance.balance+' '+msg.balance.currency; }
    if(msg.history){
      let sym=msg.echo_req.ticks_history.ticks_history;
      if(!data[sym]) data[sym]={digits:[],price:0};
      data[sym].digits = msg.history.prices.map(p=>getDigit(p));
      if(data[sym].digits.length>1000) data[sym].digits=data[sym].digits.slice(-1000);
      renderDigit();
    }
    if(msg.tick){
      let sym=msg.tick.symbol;
      if(!data[sym]) data[sym]={digits:[],price:0};
      data[sym].price=msg.tick.quote;
      data[sym].digits.push(getDigit(msg.tick.quote));
      if(data[sym].digits.length>1000) data[sym].digits=data[sym].digits.slice(-1000);
      if(sym===activeSymbol){
        document.getElementById('livePrice').textContent=msg.tick.quote;
        let d=getDigit(msg.tick.quote);
        let el=document.getElementById('lastDigit'); el.textContent=d; el.className='last '+(d%2===0?'even':'');
      }
      renderDigit();
    }
    if(msg.proposal){
      currentProposal=msg.proposal;
      document.getElementById('proposalBox').innerHTML=`Payout: <b>${msg.proposal.payout} ${msg.proposal.currency}</b> | Stake: ${msg.proposal.display_value} | Spot: ${msg.proposal.spot}`;
      if(botRunning){
        ws.send(JSON.stringify({buy:msg.proposal.id, price:parseFloat(document.getElementById('botStake').value)}));
        document.getElementById('botStatus').textContent='Bot: Imenunua - '+new Date().toLocaleTimeString()+' | Profit: $'+botProfit.toFixed(2);
      }
    }
    if(msg.buy){
      document.getElementById('buyResult').innerHTML=`✅ BUY! Contract ID: ${msg.buy.contract_id} | Buy Price: ${msg.buy.buy_price} | ID YAKO: ${MY_LOGIN_ID}`;
      getPortfolio();
    }
    if(msg.portfolio){
      let html='';
      msg.portfolio.contracts.forEach(c=>{
        let profit=parseFloat(c.profit||0);
        html+=`<div class="pos"><b>${c.display_name}</b> - ${c.contract_type}<br>Buy: ${c.buy_price} | Payout: ${c.payout} | <span class="${profit>=0?'profit':'loss'}">Profit: ${profit.toFixed(2)}</span><br><small>ID: ${c.contract_id}</small></div>`;
      });
      document.getElementById('portfolio').innerHTML=html||'Hakuna open positions';
    }
  };
}
function getDigit(price){ let s=price.toString().replace('.',''); return parseInt(s[s.length-1]); }
function subscribeTicks(sym){ if(ws && ws.readyState===1) ws.send(JSON.stringify({ticks:sym,subscribe:1})); }
function getHistory(sym){ if(ws && ws.readyState===1) ws.send(JSON.stringify({ticks_history:{ticks_history:sym,adjust_start_time:1,count:1000,end:"latest",style:"ticks"}})); }
function switchView(){ activeSymbol=document.getElementById('viewMarket').value; document.getElementById('market').value=activeSymbol; if(ws){ subscribeTicks(activeSymbol); getHistory(activeSymbol);} }
function changeType(){
  let t=document.getElementById('tradeType').value;
  document.getElementById('accuBox').style.display=(t==='ACCU')?'block':'none';
  document.getElementById('digitBox').style.display=(t==='ACCU')?'none':'block';
  if(t==='CALL'||t==='PUT') document.getElementById('digitBox').style.display='none';
}
function loginDeriv(){
  let redirect = window.location.href.split('?')[0].split('#')[0];
  window.location.href=`https://oauth.deriv.com/oauth2/authorize?app_id=${MY_APP_ID}&l=en&brand=deriv&redirect_uri=${encodeURIComponent(redirect)}`;
}
function loginWithToken(){
  token=document.getElementById('manualToken').value.trim();
  if(!token) return alert('Weka token kwanza');
  localStorage.setItem('deriv_token',token);
  connectWS();
}
function logout(){ token=null; localStorage.removeItem('deriv_token'); location.reload(); }
function getProposal(){
  if(!ws) return alert('Connect kwanza');
  let type=document.getElementById('tradeType').value;
  let stake=document.getElementById('stake').value;
  let symbol=document.getElementById('market').value;
  let digit=document.getElementById('digit').value;
  let proposal={proposal:1, amount:parseFloat(stake), basis:'stake', contract_type:type, currency:'USD', duration:parseInt(document.getElementById('duration').value), duration_unit:'t', symbol:symbol};
  if(type.startsWith('DIGIT')) proposal.barrier=digit;
  if(type==='ACCU'){ proposal={proposal:1, amount:parseFloat(stake), basis:'stake', contract_type:'ACCU', currency:'USD', symbol:symbol, growth_rate:parseFloat(document.getElementById('growth').value), barrier:document.getElementById('accuBarrier').value}; }
  ws.send(JSON.stringify(proposal));
}
function buyContract(){
  if(!token) return alert('Login kwanza na Deriv');
  if(!currentProposal) return alert('Bonyeza GET PAYOUT kwanza');
  ws.send(JSON.stringify({buy:currentProposal.id, price:parseFloat(document.getElementById('stake').value)}));
}
function getPortfolio(){
  if(!ws) return;
  ws.send(JSON.stringify({portfolio:1}));
  ws.send(JSON.stringify({balance:1, subscribe:1}));
}
function startBot(){
  if(!token) return alert('Login kwanza ili bot i-trade');
  botRunning=true; botProfit=0;
  document.getElementById('botStatus').textContent='Bot: RUNNING - Stake: '+document.getElementById('botStake').value+' | TP: '+document.getElementById('botTP').value+' | SL: '+document.getElementById('botSL').value;
  botTimer=setInterval(()=>{
    if(!botRunning) return;
    if(botProfit >= parseFloat(document.getElementById('botTP').value)){ stopBot(); alert('TP IMEFIKA! Bot imesimama. Profit: $'+botProfit); return; }
    if(botProfit <= -parseFloat(document.getElementById('botSL').value)){ stopBot(); alert('SL IMEFIKA! Bot imesimama. Loss: $'+botProfit); return; }
    let type=document.getElementById('botMode').value;
    let symbol=document.getElementById('market').value;
    let proposal={proposal:1, amount:parseFloat(document.getElementById('botStake').value), basis:'stake', contract_type:type, currency:'USD', duration:5, duration_unit:'t', symbol:symbol};
    if(type.startsWith('DIGIT')) proposal.barrier=document.getElementById('digit').value;
    if(type==='ACCU'){ proposal={proposal:1, amount:parseFloat(document.getElementById('botStake').value), basis:'stake', contract_type:'ACCU', currency:'USD', symbol:symbol, growth_rate:0.03, barrier:30}; }
    ws.send(JSON.stringify(proposal));
  },7000);
}
function stopBot(){ botRunning=false; clearInterval(botTimer); document.getElementById('botStatus').textContent='Bot: STOPPED | Profit: $'+botProfit.toFixed(2); }
function renderDigit(){
  let sym=activeSymbol; if(!data[sym]) return;
  let count=parseInt(document.getElementById('count').value);
  let digits=data[sym].digits.slice(-count);
  let counts=Array(10).fill(0); digits.forEach(x=>counts[x]++);
  let total=digits.length||1; let max=Math.max(...counts), min=Math.min(...counts);
  let last=digits.length?digits[digits.length-1]:-1;
  let circles='';
  for(let i=0;i<10;i++){
    let cls='d'; if(counts[i]===max&&total>10) cls+=' max'; if(counts[i]===min&&total>10) cls+=' min'; if(i===last) cls+=' cursor';
    circles+=`<div class="${cls}"><b>${i}</b>${(counts[i]/total*100).toFixed(1)}%</div>`;
  }
  document.getElementById('digitCircles').innerHTML=circles;
  document.getElementById('digitTiles').innerHTML=digits.slice(-100).map((x,idx)=>`<div class="tile ${x%2===0?'even':'odd'} ${idx===digits.slice(-100).length-1?'now':''}">${x}</div>`).join('');
  let even=digits.filter(x=>x%2===0).length;
  let over=digits.filter(x=>x>4).length;
  document.getElementById('digitStats').innerHTML=`
    <div class="stat">EVEN<b>${(even/total*100).toFixed(1)}%</b></div>
    <div class="stat">ODD<b>${(100-even/total*100).toFixed(1)}%</b></div>
    <div class="stat">OVER 4<b>${(over/total*100).toFixed(1)}%</b></div>
    <div class="stat">UNDER 4<b>${(100-over/total*100).toFixed(1)}%</b></div>
    <div class="stat">MATCHES 5<b>${(counts[5]/total*100).toFixed(1)}%</b></div>
    <div class="stat">DIFFERS 5<b>${(100-counts[5]/total*100).toFixed(1)}%</b></div>`;
}
window.onload=()=>{
  document.getElementById('stake').value = MY_DEFAULT_STAKE;
  document.getElementById('botStake').value = MY_DEFAULT_BOT_STAKE;
  document.getElementById('botTP').value = MY_TAKE_PROFIT;
  document.getElementById('botSL').value = MY_STOP_LOSS;
  if(MY_LOGIN_ID) document.getElementById('loginid').textContent = MY_LOGIN_ID;
  let params=new URLSearchParams(window.location.search);
  let t1=params.get('token1');
  if(t1){ token=t1; localStorage.setItem('deriv_token',t1); }
  else token=localStorage.getItem('deriv_token');
  connectWS();
  changeType();
};
</script>
</body>
